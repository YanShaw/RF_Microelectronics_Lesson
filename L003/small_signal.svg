<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570">
<rect width="1040" height="570" fill="white"/>
<g font-family="Arial, sans-serif" font-size="21" fill="#16324f">
<text x="35" y="38" font-size="26">L003: NMOS small-signal equivalent (body tied to source)</text>
<text x="35" y="75">All ground symbols share the same AC reference.</text>
<text x="115" y="235">v_in = v_g</text><text x="175" y="165">G</text>
<text x="310" y="190">g_m v_gs</text><text x="505" y="235">r_o</text>
<text x="666" y="235">R_D</text><text x="930" y="235">R_L</text>
<text x="360" y="130">D</text><text x="907" y="130">v_out = v_d</text>
<text x="354" y="333">S</text><text x="455" y="405">R_S</text>
<text x="625" y="405">C_S (optional)</text>
<text x="115" y="280">v_gs = v_g - v_s</text><text x="115" y="310">i_d positive: D to S</text>
<text x="35" y="525">Gain: keep R_L. Output resistance: remove R_L, set v_in = 0, test at D.</text>
<text x="35" y="554">R_S = 0: grounded source. Bypassed R_S: C_S is an AC short in the stated band.</text>
</g>
